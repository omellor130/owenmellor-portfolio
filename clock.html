<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #00d4ff;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .clock-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border: 2px solid #00d4ff;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .clock-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.5);
        }

        .timezone-name {
            font-size: 1.2em;
            color: #00d4ff;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .time-display {
            font-size: 2.5em;
            color: #00ff88;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
        }

        .date-display {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 10px;
        }

        .utc-offset {
            font-size: 0.85em;
            color: #ffaa00;
            font-weight: bold;
        }

        .control-panel {
            text-align: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid rgba(0, 212, 255, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .add-timezone-section {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        select {
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #00d4ff;
            background: #1a1a2e;
            color: #00d4ff;
            font-size: 1em;
            cursor: pointer;
        }

        select option {
            background: #1a1a2e;
            color: #00d4ff;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #aaa;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏰ World Clock</h1>
        
        <div class="clocks-grid" id="clocksContainer">
            <!-- Clocks will be dynamically added here -->
        </div>

        <div class="control-panel">
            <div>
                <button class="btn" onclick="resetClocks()">Reset to Default</button>
                <button class="btn" onclick="clearAllClocks()">Clear All</button>
            </div>

            <div class="add-timezone-section">
                <select id="timezoneSelect">
                    <option value="">Select a timezone to add...</option>
                </select>
                <button class="btn" onclick="addTimezone()">Add Timezone</button>
            </div>
        </div>

        <div class="footer">
            <p>All times update in real-time • Right-click on any clock to remove it</p>
        </div>
    </div>

    <script>
        const TIMEZONES = [
            { name: 'New York', tz: 'America/New_York' },
            { name: 'London', tz: 'Europe/London' },
            { name: 'Tokyo', tz: 'Asia/Tokyo' },
            { name: 'Sydney', tz: 'Australia/Sydney' },
            { name: 'Dubai', tz: 'Asia/Dubai' },
            { name: 'Singapore', tz: 'Asia/Singapore' },
            { name: 'Hong Kong', tz: 'Asia/Hong_Kong' },
            { name: 'Bangkok', tz: 'Asia/Bangkok' },
            { name: 'Mumbai', tz: 'Asia/Kolkata' },
            { name: 'Cairo', tz: 'Africa/Cairo' },
            { name: 'Moscow', tz: 'Europe/Moscow' },
            { name: 'Paris', tz: 'Europe/Paris' },
            { name: 'Berlin', tz: 'Europe/Berlin' },
            { name: 'Istanbul', tz: 'Europe/Istanbul' },
            { name: 'Los Angeles', tz: 'America/Los_Angeles' },
            { name: 'Chicago', tz: 'America/Chicago' },
            { name: 'Denver', tz: 'America/Denver' },
            { name: 'Toronto', tz: 'America/Toronto' },
            { name: 'Mexico City', tz: 'America/Mexico_City' },
            { name: 'São Paulo', tz: 'America/Sao_Paulo' },
            { name: 'Buenos Aires', tz: 'America/Argentina/Buenos_Aires' },
            { name: 'Auckland', tz: 'Pacific/Auckland' },
            { name: 'Fiji', tz: 'Pacific/Fiji' },
            { name: 'Honolulu', tz: 'Pacific/Honolulu' },
            { name: 'UTC', tz: 'UTC' },
        ];

        let displayedTimezones = [];

        function initializeTimezoneSelect() {
            const select = document.getElementById('timezoneSelect');
            TIMEZONES.forEach(tz => {
                const option = document.createElement('option');
                option.value = tz.tz;
                option.textContent = tz.name;
                select.appendChild(option);
            });
        }

        function getUTCOffset(tz) {
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: tz,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            const now = new Date();
            const utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
            const tzDate = new Date(now.toLocaleString('en-US', { timeZone: tz }));
            const offset = Math.round((tzDate - utcDate) / (1000 * 60 * 60));
            return offset;
        }

        function updateClock(tzName, tzId) {
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: tzId,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            const dateFormatter = new Intl.DateTimeFormat('en-US', {
                timeZone: tzId,
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });

            const now = new Date();
            const timeStr = formatter.format(now);
            const dateStr = dateFormatter.format(now);
            const offset = getUTCOffset(tzId);
            const offsetStr = offset >= 0 ? `UTC+${offset}` : `UTC${offset}`;

            const clockCard = document.getElementById(`clock-${tzName.replace(/\s+/g, '-')}`);
            if (clockCard) {
                clockCard.querySelector('.time-display').textContent = timeStr;
                clockCard.querySelector('.date-display').textContent = dateStr;
                clockCard.querySelector('.utc-offset').textContent = offsetStr;
            }
        }

        function createClockCard(tzName, tzId) {
            const cardId = `clock-${tzName.replace(/\s+/g, '-')}`;
            const card = document.createElement('div');
            card.className = 'clock-card';
            card.id = cardId;
            card.innerHTML = `
                <div class="timezone-name">${tzName}</div>
                <div class="time-display">--:--:--</div>
                <div class="date-display">-</div>
                <div class="utc-offset">UTC</div>
            `;
            card.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                removeTimezone(tzName, tzId);
            });
            document.getElementById('clocksContainer').appendChild(card);
            updateClock(tzName, tzId);
        }

        function addTimezone() {
            const select = document.getElementById('timezoneSelect');
            const selectedValue = select.value;
            
            if (!selectedValue) {
                alert('Please select a timezone');
                return;
            }

            const timezone = TIMEZONES.find(tz => tz.tz === selectedValue);
            
            if (displayedTimezones.some(tz => tz.tz === selectedValue)) {
                alert('This timezone is already displayed');
                return;
            }

            displayedTimezones.push(timezone);
            createClockCard(timezone.name, timezone.tz);
            select.value = '';
        }

        function removeTimezone(tzName, tzId) {
            displayedTimezones = displayedTimezones.filter(tz => tz.tz !== tzId);
            const cardId = `clock-${tzName.replace(/\s+/g, '-')}`;
            const card = document.getElementById(cardId);
            if (card) {
                card.style.animation = 'fadeOut 0.3s ease';
                setTimeout(() => card.remove(), 300);
            }
        }

        function clearAllClocks() {
            displayedTimezones = [];
            document.getElementById('clocksContainer').innerHTML = '';
        }

        function resetClocks() {
            clearAllClocks();
            const defaultTz = [
                { name: 'New York', tz: 'America/New_York' },
                { name: 'London', tz: 'Europe/London' },
                { name: 'Tokyo', tz: 'Asia/Tokyo' },
                { name: 'Sydney', tz: 'Australia/Sydney' },
                { name: 'Dubai', tz: 'Asia/Dubai' },
                { name: 'UTC', tz: 'UTC' }
            ];
            displayedTimezones = defaultTz;
            defaultTz.forEach(tz => createClockCard(tz.name, tz.tz));
        }

        function updateAllClocks() {
            displayedTimezones.forEach(tz => updateClock(tz.name, tz.tz));
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initializeTimezoneSelect();
            resetClocks();
            setInterval(updateAllClocks, 1000);
        });

        // Add fade-out animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeOut {
                from { opacity: 1; }
                to { opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
